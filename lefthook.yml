# lefthook.yml
# See https://github.com/evilmartians/lefthook for documentation

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,js}"
      run: pnpm oxfmt --check {staged_files}
      stage_fixed: false
    lint:
      glob: "*.ts"
      run: pnpm oxlint --deny-warnings {staged_files}

