# lefthook.yml
# See https://github.com/evilmartians/lefthook for documentation

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,js}"
      run: sh -c 'files="{staged_files}"; if [ -n "$files" ]; then pnpm oxfmt --check $files; fi'
      stage_fixed: false
    lint:
      glob: "*.ts"
      run: sh -c 'files="{staged_files}"; if [ -n "$files" ]; then pnpm oxlint --deny-warnings $files; fi'

