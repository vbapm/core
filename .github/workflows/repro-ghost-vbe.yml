name: Reproduce Ghost VBE Bug

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main*

permissions:
  contents: read

jobs:
  repro:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup VBA runtime
        uses: DecimalTurn/setup-vba@797e4a232699a98507cb4411d5bea3697427ad57 # v0.3.0
        with:
          office-apps: Excel

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:cli
          pnpm run build:addins

      - name: Install CLI standalone
        shell: pwsh
        run: .\installer\devinstall.ps1

      - name: Run repro script
        id: repro
        shell: powershell
        timeout-minutes: 15
        run: |
          $result = & .\scripts\ps\repro-ghost-vbe-ci.ps1 2>&1
          $reproExitCode = $LASTEXITCODE
          $output = $result | Out-String
          Write-Output $output
          if ($reproExitCode -ne 0) {
            Write-Output "::error::Repro script failed with exit code $reproExitCode"
            exit 1
          }
          $markerMatch = [regex]::Match($output, 'GHOST_COUNT=(\d+)')
          if (-not $markerMatch.Success) {
            throw 'Repro output did not contain the GHOST_COUNT marker.'
          }
          $ghostCount = [int]$markerMatch.Groups[1].Value
          Write-Output "ghost-count=$ghostCount" >> $env:GITHUB_OUTPUT
          if ($ghostCount -gt 0) {
            Write-Output "::warning::Ghost VBE projects detected: $ghostCount"
          } else {
            Write-Output "::notice::No ghost VBE projects detected."
          }

      - name: Run 10-run Alt+F4 evidence test
        id: altf4-evidence
        shell: powershell
        timeout-minutes: 45
        run: |
          $results = @()
          for ($run = 1; $run -le 10; $run++) {
            $workDir = "ghost-evidence-altf4-$run"
            Write-Output "===== Alt+F4 run $run/10 ====="
            $result = & .\scripts\ps\repro-ghost-vbe-ci.ps1 `
              -WorkDir $workDir `
              -CloseVBEBeforeClose 2>&1
            $exitCode = $LASTEXITCODE
            $output = $result | Out-String
            Write-Output $output

            $markerMatch = [regex]::Match($output, 'GHOST_COUNT=(\d+)')
            if ($exitCode -ne 0 -or -not $markerMatch.Success) {
              throw "Alt+F4 evidence run $run failed or did not emit GHOST_COUNT. Exit code: $exitCode"
            }

            $ghostCount = [int]$markerMatch.Groups[1].Value
            $results += [pscustomobject]@{
              Run = $run
              GhostCount = $ghostCount
            }
            Write-Output "altf4-run=$run ghost-count=$ghostCount"
          }

          $ghostRuns = @($results | Where-Object GhostCount -gt 0).Count
          $cleanRuns = @($results | Where-Object GhostCount -eq 0).Count
          Write-Output "ghost-runs=$ghostRuns" >> $env:GITHUB_OUTPUT
          Write-Output "clean-runs=$cleanRuns" >> $env:GITHUB_OUTPUT

          Write-Output "### Alt+F4 evidence test" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "| Runs | Ghost runs | Clean runs |" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "| ---: | ---: | ---: |" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "| 10 | $ghostRuns | $cleanRuns |" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "The VBE was hidden with verified Alt+F4 before each direct COM workbook close." >> $env:GITHUB_STEP_SUMMARY

      - name: Summary
        if: always()
        run: |
          $ghosts = "${{ steps.repro.outputs.ghost-count }}"
          if ($ghosts -eq "0") {
            Write-Output "### :white_check_mark: No ghost VBE projects" >> $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Output "### :warning: $ghosts ghost VBE project(s) detected" >> $env:GITHUB_STEP_SUMMARY
            Write-Output "" >> $env:GITHUB_STEP_SUMMARY
            Write-Output "This confirms the ghost VBE bug occurs on this machine." >> $env:GITHUB_STEP_SUMMARY
          }
