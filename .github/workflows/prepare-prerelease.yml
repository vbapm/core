name: Prepare Prerelease

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Which part of the version to bump (major, minor, patch, no-bump)'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch
          - no-bump
      prerelease_suffix:
        description: 'Pre-release identifier (e.g. alpha, beta, rc); the sequence is added automatically'
        required: true
        default: 'alpha'
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next_version.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.next_version.outputs.version }}
      release_url: ${{ steps.create_draft_release.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Get current version
        id: current_version
        run: |
          current=$(jq -r '.version' package.json)
          base="${current%%-*}"
          echo "Current version: $current (base=$base)"
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Calculate next prerelease version
        id: next_version
        env:
          CURRENT_VERSION: ${{ steps.current_version.outputs.current }}
          VERSION_BUMP: ${{ inputs.version_bump }}
          PRERELEASE_SUFFIX: ${{ inputs.prerelease_suffix }}
        run: |
          if [[ ! "$PRERELEASE_SUFFIX" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "Invalid prerelease identifier: $PRERELEASE_SUFFIX" >&2
            echo "Use letters, digits, or hyphens, without dots." >&2
            exit 1
          fi

          base="${CURRENT_VERSION%%-*}"
          IFS='.' read -r major minor patch <<< "$base"
          case "$VERSION_BUMP" in
            no-bump)
              new_base="$base"
              echo "No version bump selected."
              ;;
            major)
              ((major+=1)); minor=0; patch=0
              new_base="$major.$minor.$patch"
              ;;
            minor)
              ((minor+=1)); patch=0
              new_base="$major.$minor.$patch"
              ;;
            patch)
              ((patch+=1))
              new_base="$major.$minor.$patch"
              ;;
            *)
              echo "Unsupported version bump: $VERSION_BUMP" >&2
              exit 1
              ;;
          esac

          if git rev-parse --verify --quiet "refs/tags/v${new_base}" >/dev/null; then
            echo "Stable version v${new_base} already exists; choose a version bump for this prerelease." >&2
            exit 1
          fi

          last_sequence=0
          while IFS= read -r tag; do
            if [[ "$tag" =~ \.([0-9]+)$ ]]; then
              candidate=$((10#${BASH_REMATCH[1]}))
              if ((candidate > last_sequence)); then
                last_sequence=$candidate
              fi
            fi
          done < <(git tag --list "v${new_base}-${PRERELEASE_SUFFIX}.*")
          sequence=$((last_sequence + 1))
          new_version="$new_base-$PRERELEASE_SUFFIX.$sequence"

          changed=false
          if [[ "$new_version" != "$CURRENT_VERSION" ]]; then
            changed=true
          fi
          echo "Next version: $new_version (prerelease=true)"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$new_version" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Update package.json
        if: steps.next_version.outputs.changed == 'true'
        run: |
          NEW_VERSION="${{ steps.next_version.outputs.version }}"
          jq --indent 4 --arg v "$NEW_VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Update pnpm-lock.yaml
        if: steps.next_version.outputs.changed == 'true'
        run: pnpm install --lockfile-only

      - name: Update CHANGELOG.md
        if: steps.next_version.outputs.changed == 'true'
        run: |
          today=$(date +%Y-%m-%d)
          version="${{ steps.next_version.outputs.version }}"

          if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "CHANGELOG.md is missing the '## [Unreleased]' header."
            exit 1
          fi

          sed -i "0,/^## \[Unreleased\]$/s//## [Unreleased]\\n\\n## [$version] - $today/" CHANGELOG.md

      - name: Extract release notes from CHANGELOG
        id: release_notes
        run: |
          version="${{ steps.next_version.outputs.version }}"
          tag="v$version"
          awk "/^## \\[$version\\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md \
            | sed '/./,$!d' | sed -e :a -e '/^\s*$/{$d;N;ba}' \
            | sed 's/(\[#\([0-9]\+\)\])/(#\1)/g' > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "(No changelog entries found for $version)" > release-notes.md
          fi
          prev_tag=$(git tag --sort=-version:refname | head -1)
          if [[ -n "$prev_tag" ]]; then
            echo "" >> release-notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${prev_tag}...${tag}" >> release-notes.md
          fi

      - name: Commit changes
        id: commit
        run: |
          if [[ "${{ steps.next_version.outputs.changed }}" == "true" ]]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add package.json pnpm-lock.yaml CHANGELOG.md
            git commit -m "chore: bump version to ${{ steps.next_version.outputs.version }}"
            git push origin ${{ github.ref_name }}
          else
            echo "Version unchanged; skipping commit."
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create Draft Prerelease
        id: create_draft_release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.next_version.outputs.tag }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          body_path: release-notes.md
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-packages:
    needs: prepare-release
    runs-on: windows-2025
    outputs:
      release_url: ${{ steps.upload_assets.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      - uses: DecimalTurn/setup-vba@797e4a232699a98507cb4411d5bea3697427ad57 # v0.3.0
        with:
          office-apps: Excel

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm run build:cli

      - name: Build addins
        run: pnpm run build:addins

      - name: Create packages
        run: node scripts/create-packages

      - name: Upload release assets
        id: upload_assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: |
            dist/vbapm-win.zip
            dist/vbapm-mac.tar.gz
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add package summary
        shell: pwsh
        run: |
          $winSize = (Get-Item dist/vbapm-win.zip).Length / 1MB
          $macSize = (Get-Item dist/vbapm-mac.tar.gz).Length / 1MB
          @"
          ## Packages uploaded

          | File | Size |
          |------|------|
          | ``vbapm-win.zip`` | $([math]::Round($winSize, 2)) MB |
          | ``vbapm-mac.tar.gz`` | $([math]::Round($macSize, 2)) MB |
          "@ >> $env:GITHUB_STEP_SUMMARY

  report:
    needs: [prepare-release, build-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Add release link to summary
        run: |
          release_url="${{ needs.build-packages.outputs.release_url }}"
          if [[ -z "$release_url" ]]; then
            release_url="${{ needs.prepare-release.outputs.release_url }}"
          fi
          {
            echo "## Prerelease prepared"
            echo ""
            echo "- Tag: \`${{ needs.prepare-release.outputs.tag }}\`"
            echo "- Draft prerelease: [$release_url]($release_url)"
          } >> "$GITHUB_STEP_SUMMARY"
