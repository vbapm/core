name: Update Bootstrap

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: Commit message for bootstrap refresh
        required: false
        default: "chore: refresh bootstrap workbook"

permissions:
  contents: write

jobs:
  update-bootstrap:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup VBA runtime
        uses: DecimalTurn/setup-vba@797e4a232699a98507cb4411d5bea3697427ad57 # v0.3.0
        with:
          office-apps: Excel

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build toolchain, add-in, and bootstrap
        run: |
          pnpm run build
          pnpm run build:addins
          pnpm run build:bootstrap

      - name: Commit updated bootstrap artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scripts/bootstrap/build/bootstrap.xlsm scripts/bootstrap/vbaproject.lock

          if (git diff --staged --quiet) {
            Write-Output "No bootstrap changes detected."
            exit 0
          }

          $message = "${{ github.event.inputs.commit_message }}"
          if ([string]::IsNullOrWhiteSpace($message)) {
            $message = "chore: refresh bootstrap workbook"
          }

          git commit -m $message
          git push origin HEAD:${{ github.ref_name }}
