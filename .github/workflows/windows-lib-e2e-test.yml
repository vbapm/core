name: Windows NPM Library E2E Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/prepare-release.yml'
      - '.github/workflows/publish.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  excel-integration:
    strategy:
      matrix:
        os: [windows-2025]
        # Run Node 22.x only on main; use Node 24.x for PRs and other refs.
        node-version: ${{ github.ref == 'refs/heads/main' && fromJSON('["22.x","24.x"]') || fromJSON('["24.x"]') }}
    runs-on: ${{ matrix.os }}

    steps:
      
      - name: Configure Git
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          $autocrlf = git config --get core.autocrlf
          $eol = git config --get core.eol
          Write-Output "core.autocrlf: $autocrlf"
          Write-Output "core.eol: $eol"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup VBA runtime
        uses: DecimalTurn/setup-vba@797e4a232699a98507cb4411d5bea3697427ad57 # v0.3.0
        with:
          office-apps: Excel

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:lib
          pnpm run build:addins

      - name: Install globally from local build
        shell: pwsh
        run: |
          npm install -g .

      - name: Setup VBA project object model access
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $addinsDir = Join-Path (npm prefix -g) "node_modules\vbapm\addins\build"

          function New-Shortcut ($src, $dest) {
            try {
              $wshShell = New-Object -comObject WScript.Shell
              $shortcut = $wshShell.CreateShortcut($dest)
              $shortcut.TargetPath = $src
              $shortcut.Save()
            } catch {
              Write-Output "Failed to link add-ins, they can instead be found in $addinsDir."
            }
          }

          Write-Output "Creating shortcut to add-ins..."
          New-Shortcut "$addinsDir" "$env:AppData\Microsoft\Addins\vbapm Add-ins.lnk"

          function Enable-VBOM ($app) {
            try {
              $curVer = Get-ItemProperty -Path Registry::HKEY_CLASSES_ROOT\$app.Application\CurVer -ErrorAction Stop
              $version = $curVer.'(default)'.replace("$app.Application.", "") + ".0"
              Set-ItemProperty -Path HKCU:\Software\Microsoft\Office\$version\$app\Security -Name AccessVBOM -Value 1 -ErrorAction Stop
            } catch {
              Write-Output "Failed to enable access to VBA project object model for $app."
            }
          }

          Write-Output "Enabling access to VBA project object model..."
          Enable-VBOM "Excel"

      - name: Verify installation
        shell: pwsh
        run: |
          where.exe vba
          vba --version

      - name: Run e2e tests
        shell: pwsh
        run: |
          pnpm run test:e2e
