name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Which part of the version to bump (major, minor, patch)'
        required: true
        default: 'patch'
        type: choice
        options:
            - major
            - minor
            - patch
            - no-bump
      remove_suffix:
        description: 'Remove pre-release suffix (e.g. -alpha)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next_version.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.next_version.outputs.version }}
      release_url: ${{ steps.create_draft_release.outputs.url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Get current version
        id: current_version
        run: |
          current=$(jq -r '.version' package.json)
          # Extract base version and suffix separately
          base="${current%%-*}"
          if [[ "$current" == *-* ]]; then
            suffix="${current#*-}"
          else
            suffix=""
          fi
          echo "Current version: $current (base=$base, suffix=$suffix)"
          echo "base=$base" >> $GITHUB_OUTPUT
          echo "suffix=$suffix" >> $GITHUB_OUTPUT

      - name: Calculate next version
        id: next_version
        run: |
            IFS='.' read -r major minor patch <<< "${{ steps.current_version.outputs.base }}"
            if [[ "${{ github.event.inputs.version_bump }}" == "no-bump" ]]; then
              new_version="${{ steps.current_version.outputs.base }}"
              suffix="${{ steps.current_version.outputs.suffix }}"
              if [[ -n "$suffix" && "${{ github.event.inputs.remove_suffix }}" != "true" ]]; then
                new_version="$new_version-$suffix"
              fi
              echo "No version bump selected."
            else
              case "${{ github.event.inputs.version_bump }}" in
                major)
                  ((major+=1)); minor=0; patch=0;;
                minor)
                  ((minor+=1)); patch=0;;
                patch)
                  ((patch+=1));;
              esac
              new_version="$major.$minor.$patch"
              suffix="${{ steps.current_version.outputs.suffix }}"
              if [[ -n "$suffix" && "${{ github.event.inputs.remove_suffix }}" != "true" ]]; then
                new_version="$new_version-$suffix"
              fi
              echo "Next version: $new_version"
            fi
            echo "version=$new_version" >> $GITHUB_OUTPUT
            echo "tag=v$new_version" >> $GITHUB_OUTPUT

      - name: Update package.json
        run: |
            if [[ "${{ github.event.inputs.version_bump }}" != "no-bump" ]]; then
              NEW_VERSION="${{ steps.next_version.outputs.version }}"
              jq --indent 4 --arg v "$NEW_VERSION" '.version = $v' package.json > package.json.tmp
              mv package.json.tmp package.json
            else
              echo "Skipping package.json update (no-bump selected)"
            fi

      - name: Update pnpm-lock.yaml
        if: github.event.inputs.version_bump != 'no-bump'
        run: pnpm install --lockfile-only

      - name: Update CHANGELOG.md
        if: github.event.inputs.version_bump != 'no-bump'
        run: |
          today=$(date +%Y-%m-%d)
          version="${{ steps.next_version.outputs.version }}"

          if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "CHANGELOG.md is missing the '## [Unreleased]' header."
            exit 1
          fi

          # Insert the new release header right after [Unreleased], moving current notes into the new version section.
          sed -i "0,/^## \[Unreleased\]$/s//## [Unreleased]\\n\\n## [$version] - $today/" CHANGELOG.md

      - name: Extract release notes from CHANGELOG
        id: release_notes
        run: |
          version="${{ steps.next_version.outputs.version }}"
          tag="v$version"
          # Extract lines between the version header and the next ## header
          # Trim surrounding blank lines and normalize changelog issue refs from ([#123]) to (#123).
          awk "/^## \\[$version\\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md \
            | sed '/./,$!d' | sed -e :a -e '/^\s*$/{$d;N;ba}' \
            | sed 's/(\[#\([0-9]\+\)\])/(#\1)/g' > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "(No changelog entries found for $version)" > release-notes.md
          fi
          prev_tag=$(git tag --sort=-version:refname | head -1)
          if [[ -n "$prev_tag" ]]; then
            echo "" >> release-notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${prev_tag}...${tag}" >> release-notes.md
          fi

      - name: Commit changes
        id: commit
        run: |
            if [[ "${{ github.event.inputs.version_bump }}" != "no-bump" ]]; then
              git config user.name "github-actions"
              git config user.email "github-actions@github.com"
              git add package.json pnpm-lock.yaml CHANGELOG.md
              git commit -m "chore: bump version to ${{ steps.next_version.outputs.version }}"
              git push origin ${{ github.ref_name }}
              echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
            else
              echo "Skipping commit (no-bump selected)"
              echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
            fi

      - name: Create Draft Release
        id: create_draft_release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.next_version.outputs.tag }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          body_path: release-notes.md
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-packages:
    needs: prepare-release
    runs-on: windows-2025
    outputs:
      release_url: ${{ steps.upload_assets.outputs.url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      - uses: DecimalTurn/setup-vba@main
        with:
          office-apps: Excel

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build:cli

      - name: Build addins
        run: npm run build:addins

      - name: Create packages
        run: node scripts/create-packages

      - name: Upload release assets
        id: upload_assets
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: |
            dist/vbapm-win.zip
            dist/vbapm-mac.tar.gz
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add package summary
        shell: pwsh
        run: |
          $winSize = (Get-Item dist/vbapm-win.zip).Length / 1MB
          $macSize = (Get-Item dist/vbapm-mac.tar.gz).Length / 1MB
          @"
          ## Packages uploaded

          | File | Size |
          |------|------|
          | ``vbapm-win.zip`` | $([math]::Round($winSize, 2)) MB |
          | ``vbapm-mac.tar.gz`` | $([math]::Round($macSize, 2)) MB |
          "@ >> $env:GITHUB_STEP_SUMMARY

  report:
    needs: [prepare-release, build-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Add release link to summary
        run: |
          release_url="${{ needs.build-packages.outputs.release_url }}"
          # Fall back to the URL captured before asset upload if needed
          if [[ -z "$release_url" ]]; then
            release_url="${{ needs.prepare-release.outputs.release_url }}"
          fi
          {
            echo "## Release prepared"
            echo ""
            echo "- Tag: \`${{ needs.prepare-release.outputs.tag }}\`"
            echo "- Draft release: [$release_url]($release_url)"
          } >> "$GITHUB_STEP_SUMMARY"
