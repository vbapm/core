name: Windows CLI Tool E2E Test

on:
  push:
    branches:
      - main*
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/prepare-release.yml'
      - '.github/workflows/publish.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  excel-integration:
    strategy:
      matrix:
        os: [windows-2025]
    runs-on: ${{ matrix.os }}

    steps:
      
      - name: Configure Git
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          $autocrlf = git config --get core.autocrlf
          $eol = git config --get core.eol
          Write-Output "core.autocrlf: $autocrlf"
          Write-Output "core.eol: $eol"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup VBA runtime
        uses: DecimalTurn/setup-vba@abad6bed4025d3d709cbd9c9281f856d298bd68d # v0.1.2
        with:
          office-apps: Excel

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:cli
          pnpm run build:addins

      - name: Install CLI standalone App (local build)
        shell: pwsh
        run: |
          .\installer\devinstall.ps1

      - name: Verify installation
        shell: pwsh
        run: |
          where.exe vba
          vba --version

      - name: Run e2e tests (installed CLI)
        shell: pwsh
        run: |
          $env:VBA_BIN_DIR = Join-Path $env:APPDATA "vbapm\bin"
          Write-Output "Using VBA_BIN_DIR=$env:VBA_BIN_DIR"
          pnpm run test:e2e
