name: Test and Build
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          CI: true
      - name: Check config templates sync
        run: pnpm run check:config-templates
      - name: Format Check
        run: pnpm run format:check
      - name: Lint Check
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build:dev
