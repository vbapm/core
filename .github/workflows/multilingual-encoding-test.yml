name: Multilingual Encoding Test

on:
  push:
branches:
      - main*
    paths-ignore:
      - "**/*.md"
  # The pull_request trigger is disabled to reduce CI usage, but when doing a PR involving encoding changes, 
  # you can temporarily enable this trigger to run the multilingual encoding tests on the PR.
  # pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multilingual:
    runs-on: windows-2025

    steps:
      - name: Configure Git
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify fixture encoding after checkout
        shell: pwsh
        run: |
          $files = @{
            cp1252 = "French.bas"
            cp1251 = "Russian.bas"
            cp1250 = "Polish.bas"
            cp1253 = "Greek.bas"
            cp1254 = "Turkish.bas"
            cp1255 = "Hebrew.bas"
            cp1256 = "Arabic.bas"
            cp1257 = "Lithuanian.bas"
            cp1258 = "Vietnamese.bas"
            cp932  = "Japanese.bas"
            cp936  = "SimplifiedChinese.bas"
            cp874  = "Thai.bas"
            cp949  = "Korean.bas"
            cp950  = "TraditionalChinese.bas"
          }
          foreach ($cp in $files.Keys) {
            $file = "tests/__fixtures__/multilingual/$cp/src/$($files[$cp])"
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $file).Path)
            $hex = ($bytes | ForEach-Object { '{0:X2}' -f $_ }) -join ' '
            Write-Output "$cp ($($bytes.Length) bytes): $hex"
          }

      - name: Setup VBA runtime
        uses: DecimalTurn/setup-vba@797e4a232699a98507cb4411d5bea3697427ad57 # v0.3.0
        with:
          office-apps: Excel

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:cli
          pnpm run build:addins

      # After some verifications, the ACP  codepage change needs a restart of Windows to take effect.
      # This means that we can't test the ACP change and that test only makes sure that the VBE is able 
      # to handle build-extract rountrip in CP1252 encoding (default encodng of GitHub's windows-runners)

      - name: Run multilingual encoding tests
        shell: pwsh
        run: |
          # The loop script tests all codepages with fixtures, switching the ACP.
          # Excel is killed between iterations so new processes pick up
          # the changed ACP codepage.
          ./tests/multilang-loop.ps1
